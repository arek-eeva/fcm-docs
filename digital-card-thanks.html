<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F2F2EF">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  >
  <meta name="description" content="Your details have been sent to Arek Rainczuk.">
  <title>Details received | Arek Rainczuk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600&family=Literata:wght@400&family=Vidaloka&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: light;
      --paper: #f2f2ef;
      --surface: #fafaf8;
      --ink: #181719;
      --muted: #686367;
      --line: #d1cecb;
      --red: #bd202d;
      --red-dark: #a91d29;
      --display: "Vidaloka", Georgia, serif;
      --body: "Literata", Georgia, serif;
      --label: "Khand", "Arial Narrow", Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--paper);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 64px) 20px;
      background:
        linear-gradient(
          90deg,
          transparent 0 9%,
          rgb(24 23 25 / 3.5%) 9% 9.15%,
          transparent 9.15%
        ),
        var(--paper);
      color: var(--ink);
      font-family: var(--body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 560px);
    }

    .brand {
      margin: 0 0 28px;
      color: var(--muted);
      font-family: var(--label);
      font-size: 0.83rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .brand::after {
      content: "";
      display: inline-block;
      width: 44px;
      height: 2px;
      margin: 0 0 3px 13px;
      background: var(--red);
    }

    .confirmation {
      position: relative;
      isolation: isolate;
      padding: clamp(30px, 7vw, 52px);
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgb(24 23 25 / 8%);
    }

    .confirmation::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -9px 9px 9px -9px;
      border: 2px solid var(--red);
      transform: rotate(-1.2deg);
    }

    .kicker {
      margin: 0 0 17px;
      color: var(--red);
      font-family: var(--label);
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-family: var(--display);
      font-size: clamp(2.5rem, 11vw, 4.2rem);
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 0.98;
    }

    .message {
      max-width: 37ch;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.8vw, 1.08rem);
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 32px;
    }

    .action {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      color: var(--ink);
      font-family: var(--label);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-decoration: none;
      transition:
        border-color 180ms ease,
        background-color 180ms ease,
        color 180ms ease;
    }

    .action-primary {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
      font-weight: 600;
    }

    .action:hover {
      border-color: var(--red);
    }

    .action-primary:hover {
      background: var(--red-dark);
    }

    .action:focus-visible,
    .contact:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 4px;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 18px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--label);
      font-size: 0.84rem;
      letter-spacing: 0.025em;
    }

    .contact {
      color: inherit;
      text-decoration-color: transparent;
      text-underline-offset: 4px;
    }

    .contact:hover {
      color: var(--ink);
      text-decoration-color: var(--red);
    }

    @media (max-width: 420px) {
      .confirmation {
        padding: 30px 24px;
      }

      .confirmation::before {
        inset: -7px 7px 7px -7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="brand">Fifth Castle Media</p>

    <section class="confirmation" aria-labelledby="confirmation-title">
      <p class="kicker">Details received</p>
      <h1 id="confirmation-title">Thanks. Your details are with Arek.</h1>
      <p class="message">
        He’ll follow up directly. You can return to the card or book a time now
        if that’s easier.
      </p>

      <nav class="actions" aria-label="Next steps">
        <a class="action action-primary" href="https://card.fifthcastle.media/fcm/arek/">
          Return to Arek’s card
        </a>
        <a class="action" href="https://app.fifthcastle.media/widget/bookings/chat-with-arek">
          Book a meeting
        </a>
      </nav>
    </section>

    <footer class="footer">
      <span>Your strategic partner in video production.</span>
      <!--email_off-->
      <a class="contact" href="mailto:info@fifthcastle.media">info@fifthcastle.media</a>
      <!--/email_off-->
    </footer>
  </main>
</body>
</html>
